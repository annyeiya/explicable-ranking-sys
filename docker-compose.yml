version: "3.9"

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - spring

  spring:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - model-service

  model-service:
    build: 
      context: ./model-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./model-service/model:/app/model
      - ./model-service/knowledge:/app/knowledge
